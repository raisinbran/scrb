name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Prettier on changed TypeScript
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git diff --name-only -z 444e1ce HEAD -- '*.ts' '*.tsx' ':!packages/contracts/**')
          if (("${#files[@]}" > 0)); then
            npx prettier --write "${files[@]}"
            git diff --check
            git diff -- "${files[@]}"
            git diff --exit-code -- "${files[@]}"
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build -w @scrb/summary
      - run: npm test
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm run test:smoke
