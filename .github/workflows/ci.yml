name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the import decoder
        id: decoder-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/transcription/.bin/ffmpeg
            packages/transcription/.bin/ffmpeg.exe
            packages/transcription/.bin/ffprobe
            packages/transcription/.bin/ffprobe.exe
          key: decoder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/transcription/scripts/build-ffmpeg.sh') }}
      - name: Build the import decoder (macOS)
        if: runner.os == 'macOS' && steps.decoder-cache.outputs.cache-hit != 'true'
        run: npm run build:ffmpeg -w @scrb/transcription
      - name: Build the import decoder (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows' && steps.decoder-cache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: '1'
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make diffutils nasm xz curl" || exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "bash packages/transcription/scripts/build-ffmpeg.sh"
      - name: Check Prettier on changed TypeScript
        shell: bash
        run: |
          # Batch the file list: one command line with every changed file exceeds the Windows limit.
          git diff --name-only --diff-filter=ACMR -z 444e1ce HEAD -- '*.ts' '*.tsx' | xargs -0 -r -n 40 npx prettier --write
          git diff --check
          git diff --exit-code -- '*.ts' '*.tsx'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build -w @scrb/summary
      - name: Test
        run: npm test
        env:
          SCRB_REQUIRE_DECODER: '1'
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm run test:smoke
