name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the import decoder (macOS)
        if: runner.os == 'macOS'
        id: decoder-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/transcription/.bin/ffmpeg
            packages/transcription/.bin/ffprobe
          key: decoder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/transcription/scripts/build-ffmpeg.sh') }}
      - name: Build the import decoder (macOS)
        if: runner.os == 'macOS' && steps.decoder-cache.outputs.cache-hit != 'true'
        run: npm run build:ffmpeg -w @scrb/transcription
      - name: Check Prettier on changed TypeScript
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git diff --name-only -z 444e1ce HEAD -- '*.ts' '*.tsx')
          if (("${#files[@]}" > 0)); then
            npx prettier --write "${files[@]}"
            git diff --check
            git diff -- "${files[@]}"
            git diff --exit-code -- "${files[@]}"
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build -w @scrb/summary
      - name: Test
        run: npm test
        env:
          # macOS only: Windows has no decoder build yet and prints a skip warning.
          SCRB_REQUIRE_DECODER: ${{ runner.os == 'macOS' && '1' || '0' }}
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm run test:smoke
