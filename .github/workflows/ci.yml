name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-capture-source-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build pinned libopus and Windows capture helper
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe is missing from the Windows 2022 runner' }
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio 2022 x64 C++ tools are missing from the runner' }
          $env:SCRB_VCVARS64 = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $env:SCRB_VCVARS64 -PathType Leaf)) { throw 'Visual Studio x64 environment setup script is missing' }
          & .\native\windows-capture\scripts\fetch-opus.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned libopus build failed' }
          & .\native\windows-capture\build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Windows capture helper build failed' }
      - name: Run capture pipeline tests
        shell: pwsh
        run: |
          & .\native\windows-capture\build\bin\PipelineTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Capture pipeline tests failed' }
          & .\native\windows-capture\build\bin\LivePcmTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Live PCM feed tests failed' }

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the import decoder
        id: decoder-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/transcription/.bin/ffmpeg
            packages/transcription/.bin/ffmpeg.exe
            packages/transcription/.bin/ffprobe
            packages/transcription/.bin/ffprobe.exe
          key: decoder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/transcription/scripts/build-ffmpeg.sh') }}
      - name: Build the import decoder (macOS)
        if: runner.os == 'macOS' && steps.decoder-cache.outputs.cache-hit != 'true'
        run: npm run build:ffmpeg -w @scrb/transcription
      - name: Build the import decoder (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows' && steps.decoder-cache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: '1'
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc make diffutils nasm xz curl" || exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "bash packages/transcription/scripts/build-ffmpeg.sh"
      - name: Check Prettier on changed TypeScript
        shell: bash
        run: |
          # Batch the file list: one command line with every changed file exceeds the Windows limit.
          git diff --name-only --diff-filter=ACMR -z 444e1ce HEAD -- '*.ts' '*.tsx' | xargs -0 -r -n 40 npx prettier --write
          git diff --check
          git diff --exit-code -- '*.ts' '*.tsx'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build -w @scrb/summary
      - name: Test
        run: npm test
        env:
          SCRB_REQUIRE_DECODER: '1'
      - name: Check boundaries
        run: npm run check:boundaries
        env:
          CONTRACT_APPROVED: ${{ github.event.pull_request.number == 342 && github.event.pull_request.head.repo.full_name == 'raisinbran/scrb' && '1' || '0' }}
      - run: npm run build
      - run: npm run test:smoke
