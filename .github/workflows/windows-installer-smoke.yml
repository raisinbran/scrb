name: Windows installer smoke

on:
  pull_request:
    paths:
      - '.github/workflows/windows-installer-smoke.yml'
      - 'scripts/*win*installer*.ps1'
      - 'scripts/*win*installer*.mjs'
      - 'scripts/stage-win-tools.mjs'
      - 'scripts/build-win-hosted-tools.ps1'
  workflow_dispatch:
    inputs:
      genuine_source_build_and_install:
        description: 'Build pinned public sources and perform a real disposable-user NSIS smoke'
        required: true
        type: boolean
        default: false
      encrypted_installer_transfer:
        description: 'Separate owner authorization: encrypted ciphertext-only handoff for this exact first-attempt dispatch'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted-standard-user-guards:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable standard user; guard checks only
        shell: pwsh
        run: ./scripts/run-win-installer-smoke-standard-user.ps1 -RunnerTemp $env:RUNNER_TEMP
      - name: Guard-only scope declaration
        if: always()
        shell: pwsh
        run: |
          @'
          ## Guard-only CI — not an installed app result

          A PR-triggered run executes only behavioral guards under a disposable normal user.
          Real source compilation, NSIS install and uninstall are NOT VERIFIED by this job.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  # Never launch untrusted installer bytes on pull_request. No plaintext
  # executable may be uploaded to the public repository's Actions artifacts.
  verified-installer-producer:
    if: github.event_name == 'workflow_dispatch' && inputs.genuine_source_build_and_install == true && inputs.encrypted_installer_transfer == true && github.actor == 'raisinbran' && github.triggering_actor == 'raisinbran' && github.repository == 'raisinbran/scrb' && github.ref == 'refs/heads/main' && github.workflow_ref == 'raisinbran/scrb/.github/workflows/windows-installer-smoke.yml@refs/heads/main' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 105
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      source_commit: ${{ steps.package.outputs.source_commit }}
      provenance_sha256: ${{ steps.package.outputs.provenance_sha256 }}
      dependency_audit_sha256: ${{ steps.package.outputs.dependency_audit_sha256 }}
      producer_run_id: ${{ steps.package.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.package.outputs.producer_run_attempt }}
    env:
      SCRB_GENUINE_INSTALLER_AUTHORIZED: 'true'
      SCRB_ENCRYPTED_INSTALLER_AUTHORIZED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unauthorized, reattempted or non-main producer before build
        shell: pwsh
        run: |
          Import-Module ./scripts/win-installer-encrypted-transfer.psm1 -Force
          Assert-EncryptedInstallerDispatch -Job 'verified-installer-producer'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build all seven tools from pinned public sources, validate MSVC runtime signatures, stage DLL/license closure
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'apps/desktop/build/win-stage/bin'
          $evidence = Join-Path $env:RUNNER_TEMP 'public-source-build-evidence.json'
          ./scripts/build-win-hosted-tools.ps1 -StagingDirectory $stage -SourceEvidenceFile $evidence
      - name: Build real unpacked Scribe with verified seven-tool staging
        shell: pwsh
        run: ./scripts/package-win.ps1 -Slice 3
      - name: Build NSIS and emit independently protected producer job outputs
        id: package
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'apps/desktop/build/win-stage/bin'
          $unpacked = Join-Path $PWD 'apps/desktop/release/win-unpacked'
          ./scripts/package-win-installer.ps1 -StagingDirectory $stage -PrepackagedDirectory $unpacked
      - name: Verify and prepare exactly five public-source-only transfer files
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'apps/desktop/build/win-stage/bin'
          $folders = @(Get-ChildItem -LiteralPath 'apps/desktop' -Directory -Filter 'release-installer-build-*')
          if ($folders.Count -ne 1) { throw 'Expected exactly one NSIS output directory' }
          $buildDir = $folders[0].FullName
          $installers = @(Get-ChildItem -LiteralPath $buildDir -File -Filter 'Scribe Setup *.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'scribe-installer-artifact'
          if (Test-Path -LiteralPath $destination) { throw 'Refusing to reuse a candidate transfer root' }
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop | Out-Null
          $app = Join-Path $PWD 'apps/desktop/release/win-unpacked/Scribe.exe'
          $manifest = Join-Path $buildDir 'scribe-installer-candidate.json'
          $argsList = @(
            'scripts/win-installer-candidate-manifest.mjs','verify',
            '--installer',$installers[0].FullName,
            '--application',$app,
            '--provenance',(Join-Path $stage 'PROVENANCE.json'),
            '--audit',(Join-Path $stage 'DEPENDENCY-AUDIT.json'),
            '--commit',$env:GITHUB_SHA,'--manifest',$manifest
          )
          & node @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Producer candidate manifest verification failed' }
          foreach ($file in @($installers[0].FullName,$app,$manifest,
                              (Join-Path $stage 'PROVENANCE.json'),
                              (Join-Path $stage 'DEPENDENCY-AUDIT.json'))) {
            Copy-Item -LiteralPath $file -Destination $destination -ErrorAction Stop
          }
          if (@(Get-ChildItem -LiteralPath $destination -File).Count -ne 5) {
            throw 'Unapproved source-build artifact content'
          }
      - name: Encrypt exactly five candidate files into one ciphertext-only upload root
        shell: pwsh
        run: |
          ./scripts/prepare-win-installer-encrypted-transfer.ps1 `
            -CandidateRoot (Join-Path $env:RUNNER_TEMP 'scribe-installer-artifact') `
            -RecipientFile '.github/windows-installer-age-recipient.txt'
      - name: Upload ONLY ciphertext for this run and attempt
        uses: actions/upload-artifact@v4
        with:
          name: scribe-encrypted-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scribe-encrypted-upload/scribe-installer-candidate.age
          if-no-files-found: error
          retention-days: 1

  hosted-real-installer-smoke:
    needs: verified-installer-producer
    if: github.event_name == 'workflow_dispatch' && inputs.genuine_source_build_and_install == true && inputs.encrypted_installer_transfer == true && github.actor == 'raisinbran' && github.triggering_actor == 'raisinbran' && github.repository == 'raisinbran/scrb' && github.ref == 'refs/heads/main' && github.workflow_ref == 'raisinbran/scrb/.github/workflows/windows-installer-smoke.yml@refs/heads/main' && github.run_attempt == 1 && needs.verified-installer-producer.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: windows-installer-test-decrypt
    env:
      SCRB_GENUINE_INSTALLER_AUTHORIZED: 'true'
      SCRB_ENCRYPTED_INSTALLER_AUTHORIZED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject unauthorized, reattempted or non-main consumer
        shell: pwsh
        run: |
          Import-Module ./scripts/win-installer-encrypted-transfer.psm1 -Force
          Assert-EncryptedInstallerDispatch -Job 'hosted-real-installer-smoke'
      - name: Download exactly one run-and-attempt-scoped ciphertext artifact
        uses: actions/download-artifact@v4
        with:
          name: scribe-encrypted-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scribe-encrypted-download
      - name: Decrypt, reject unsafe archive entries and independently attest candidate before launch
        shell: pwsh
        env:
          WIN_INSTALLER_SMOKE_AGE_IDENTITY: ${{ secrets.WIN_INSTALLER_SMOKE_AGE_IDENTITY }}
          TRUSTED_MANIFEST_SHA256: ${{ needs.verified-installer-producer.outputs.manifest_sha256 }}
          TRUSTED_SOURCE_COMMIT: ${{ needs.verified-installer-producer.outputs.source_commit }}
          TRUSTED_PROVENANCE_SHA256: ${{ needs.verified-installer-producer.outputs.provenance_sha256 }}
          TRUSTED_DEPENDENCY_AUDIT_SHA256: ${{ needs.verified-installer-producer.outputs.dependency_audit_sha256 }}
          TRUSTED_PRODUCER_RUN_ID: ${{ needs.verified-installer-producer.outputs.producer_run_id }}
          TRUSTED_PRODUCER_RUN_ATTEMPT: ${{ needs.verified-installer-producer.outputs.producer_run_attempt }}
        run: |
          ./scripts/receive-win-installer-encrypted-transfer.ps1 `
            -TrustedManifestSha256 $env:TRUSTED_MANIFEST_SHA256 `
            -TrustedSourceCommit $env:TRUSTED_SOURCE_COMMIT `
            -TrustedProvenanceSha256 $env:TRUSTED_PROVENANCE_SHA256 `
            -TrustedDependencyAuditSha256 $env:TRUSTED_DEPENDENCY_AUDIT_SHA256 `
            -TrustedProducerRunId $env:TRUSTED_PRODUCER_RUN_ID `
            -TrustedProducerRunAttempt $env:TRUSTED_PRODUCER_RUN_ATTEMPT
      - name: Independent baseline guards under a disposable standard user
        shell: pwsh
        run: ./scripts/run-win-installer-smoke-standard-user.ps1 -RunnerTemp $env:RUNNER_TEMP
      - name: Attest independently and run genuine normal-user NSIS installer, shortcut and uninstall
        shell: pwsh
        run: |
          $trusted = @{
            RunnerTemp = $env:RUNNER_TEMP
            TrustedManifestSha256 = '${{ needs.verified-installer-producer.outputs.manifest_sha256 }}'
            TrustedSourceCommit = '${{ needs.verified-installer-producer.outputs.source_commit }}'
            TrustedProvenanceSha256 = '${{ needs.verified-installer-producer.outputs.provenance_sha256 }}'
            TrustedDependencyAuditSha256 = '${{ needs.verified-installer-producer.outputs.dependency_audit_sha256 }}'
            TrustedProducerRunId = '${{ needs.verified-installer-producer.outputs.producer_run_id }}'
            TrustedProducerRunAttempt = '${{ needs.verified-installer-producer.outputs.producer_run_attempt }}'
          }
          ./scripts/run-win-installer-smoke-real-standard-user.ps1 @trusted
