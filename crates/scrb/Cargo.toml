[package]
name = "scrb"
version = "0.1.0"
edition = "2024"
# `File::try_lock`, which the library's locks use, arrived in Rust 1.89.
rust-version = "1.89"
publish = false

[dependencies]
claxon = "=0.4.3"
clap = { version = "=4.6.7", features = ["derive"] }
hound = "=3.5.1"
jiff = "=0.2.43"
regex = "=1.13.1"
rubato = "=5.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
shell-words = "=1.1.1"
tempfile = "=3.27.0"
toml = { version = "=1.2.1", default-features = false, features = ["std", "parse", "serde"] }
