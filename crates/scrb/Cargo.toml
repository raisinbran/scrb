[package]
name = "scrb"
version = "0.1.0"
edition = "2024"
# `File::try_lock`, which the library's locks use, arrived in Rust 1.89.
rust-version = "1.89"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
jiff = "=0.2.43"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
