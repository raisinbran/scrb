[env]
# C code that later crates build, such as SQLite and libopus, must load on macOS 14.6.
MACOSX_DEPLOYMENT_TARGET = "14.6"
# ts-rs writes into the shared types package. Its generated imports end in `.ts`, like the rest of
# that package.
TS_RS_EXPORT_DIR = { value = "packages/contracts/src/generated", relative = true }
TS_RS_IMPORT_EXTENSION = "ts"
# The screens type every number as `number`. No value reaches 2^53.
TS_RS_LARGE_INT = "number"
