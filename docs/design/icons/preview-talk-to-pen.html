<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scribe icon options: talk to pen</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 24px;
        background: #888;
        color: #111;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 15px;
        margin: 24px 0 8px;
      }
      .row {
        display: flex;
        margin-bottom: 6px;
      }
      .panel {
        padding: 14px 18px;
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }
      .big {
        flex: 0 0 330px;
        justify-content: center;
      }
      .small {
        flex: 0 0 190px;
      }
      .light {
        background: #f4f4f6;
        color: #111;
      }
      .dark {
        background: #1a1b1e;
        color: #f2f3f5;
      }
      figure {
        margin: 0;
        text-align: center;
        font-size: 11px;
      }
      figure img {
        display: block;
        margin: 0 auto 4px;
      }
    </style>
  </head>
  <body>
    <h1>Scribe icon options: talk to pen</h1>
    <p>
      Options for the owner to choose from; none is shipped. Large (320 px), then 16, 32 and 64 px,
      on light and dark backgrounds.
    </p>
    <h2>D. Head talking, arcs to a pen writing</h2>
    <div class="row">
      <div class="panel big light">
        <figure><img src="scribe-talk-head.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small light">
        <figure><img src="scribe-talk-head.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-head.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-head.svg" width="64" height="64" alt="" />64</figure>
      </div>
      <div class="panel big dark">
        <figure><img src="scribe-talk-head.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small dark">
        <figure><img src="scribe-talk-head.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-head.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-head.svg" width="64" height="64" alt="" />64</figure>
      </div>
    </div>
    <h2>E. Mouth talking, arcs to a pen writing</h2>
    <div class="row">
      <div class="panel big light">
        <figure><img src="scribe-talk-mouth.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small light">
        <figure><img src="scribe-talk-mouth.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-mouth.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-mouth.svg" width="64" height="64" alt="" />64</figure>
      </div>
      <div class="panel big dark">
        <figure><img src="scribe-talk-mouth.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small dark">
        <figure><img src="scribe-talk-mouth.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-mouth.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-mouth.svg" width="64" height="64" alt="" />64</figure>
      </div>
    </div>
    <h2>F. Person talking, arcs to a pen writing</h2>
    <div class="row">
      <div class="panel big light">
        <figure><img src="scribe-talk-bust.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small light">
        <figure><img src="scribe-talk-bust.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-bust.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-bust.svg" width="64" height="64" alt="" />64</figure>
      </div>
      <div class="panel big dark">
        <figure><img src="scribe-talk-bust.svg" width="320" height="320" alt="" />320</figure>
      </div>
      <div class="panel small dark">
        <figure><img src="scribe-talk-bust.svg" width="16" height="16" alt="" />16</figure>
        <figure><img src="scribe-talk-bust.svg" width="32" height="32" alt="" />32</figure>
        <figure><img src="scribe-talk-bust.svg" width="64" height="64" alt="" />64</figure>
      </div>
    </div>
  </body>
</html>
